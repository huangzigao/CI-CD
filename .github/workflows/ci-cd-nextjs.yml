name: ci-cd Next.js CI

on:
  push:
    branches: [develop, main]
    paths:
      - "ci-cd/**"
      - ".github/workflows/ci-cd-nextjs.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "ci-cd/**"
      - ".github/workflows/ci-cd-nextjs.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ci-cd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci-cd/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git status
            git pull --ff-only origin main
            cd ci-cd
            npm ci
            npm run build
            pm2 describe ci-cd-nextjs >/dev/null && pm2 reload ci-cd-nextjs || pm2 start npm --name ci-cd-nextjs -- start
            pm2 save
